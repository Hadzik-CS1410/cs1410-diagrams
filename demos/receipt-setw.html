<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CS 1410 &middot; CT 1 &mdash; Lining up columns with setw</title>
<style>
/* @stepper:css */
/* stepper.css -- the canonical look of every CS 1410 stepper.
 *
 * Do not edit this inside a stepper. Edit it HERE, then run
 * `python scripts/build_steppers.py`, which inlines it into every stepper
 * between its @stepper:css markers. `--check` reports drift. Same contract as
 * templates/cpp-starter/ and sync_tooling.py, and for the same reason: there
 * will be two steppers a week for twelve weeks, and twenty-five hand-copied
 * copies of a 900-line file drift by the sixth one.
 *
 * Sizes, colours and spacing are CT0's (hello-cpp), kept deliberately: it is
 * the one that has been shown on a projector and it reads from the back.
 */

:root {
  --ink: #2c3e50; --muted: #5b6b7a; --line: #d7dae0; --bg: #fcfcfd;
  --blue: #2980b9; --blueBg: #eaf2f8;
  --purple: #8e44ad; --purpleBg: #f5eef8;
  --green: #27ae60; --greenBg: #f0faf0;
  --orange: #e67e22; --orangeBg: #fff3e0;
  --red: #c0392b; --redBg: #fdecea;
}
* { box-sizing: border-box; }

/* Reserve the scrollbar's space, always.
 *
 * This is the real cause of the panes shifting. When one step is short and the
 * next is tall, the page's vertical scrollbar appears -- and the viewport
 * instantly narrows by ~15px, so every column shifts left. It looks like the
 * layout is moving; what moved is the window. In CT0 it happens between steps
 * 3 and 4 of the first tab.
 *
 * Reserving the gutter means the scrollbar costs its width whether or not it
 * is there, so appearing can never move anything. The @supports fallback is
 * for engines without scrollbar-gutter, where always painting a track does
 * the same job less elegantly.
 *
 * This makes the shift impossible. It does NOT make a too-tall step acceptable
 * -- see the one-screen rule in templates/stepper/README.md, which
 * verify_stepper.js enforces. */
html { scrollbar-gutter: stable; }
@supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }

/* Tight furniture. 342px of the 760px one-screen budget used to be chrome
   before a single line of content -- padding, heading, tabs, controls,
   legend. Trimming it buys ~74px for teaching on EVERY step of every
   stepper, which is a better trade than cutting an explanation. */
body { margin: 0; padding: 14px 16px 20px;
       font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
       color: var(--ink); background: #fff; }
/* No max-width. These run the full browser width and read far better for it --
   code, terminal and explanation side by side instead of stacked. */
.wrap { margin: 0 auto; }
h1 { font-size: 1.35rem; margin: 0 0 .35rem; }
.sub { color: var(--muted); margin: 0 0 .6rem; line-height: 1.5; font-size: .9rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        border-bottom: 2px solid var(--line); padding-bottom: 7px; margin-bottom: 10px; }
.tabs button { font-size: .95rem; font-weight: 600; cursor: pointer; padding: 8px 14px;
               border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.spacer { flex: 1; }
.hint { color: var(--muted); font-size: .85rem; }
.panel { border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
         padding: 7px 12px; margin-bottom: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lbl { font-weight: 700; font-size: .85rem; color: var(--muted);
       text-transform: uppercase; letter-spacing: .04em; min-width: 54px; }
.ctl { font: inherit; cursor: pointer; padding: 6px 12px; border: 1px solid var(--line);
       border-radius: 6px; background: #fff; color: var(--ink); }
.ctl:disabled { opacity: .4; cursor: default; }
.ctl.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
.count { margin-left: auto; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

/* Names the TODO the current step is for, on EVERY step. The hand-off card at
   the end of a tab says "go write it"; this says "this is the one" the whole
   way through. */
.todobar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           background: #fff8e1; border-left: 5px solid #8f6a00;
           border-radius: 0 8px 8px 0; padding: .35rem .85rem; margin-bottom: 10px;
           min-height: 40px; }
.todobar .tag { background: #8f6a00; color: #fff; border-radius: 4px;
                padding: .1rem .5rem; font-size: .76rem; letter-spacing: .05em; }
.todobar .what { font-size: 1rem; }
.todobar code { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: .89rem; }

/* ------------------------------------------------------------------ THE SPLIT
 * Code on the left, terminal and explanation on the right, EVENLY, and the
 * divide does not move from step to step.
 *
 * It used to be `minmax(0,1.2fr) minmax(0,1fr)`, and the panes visibly shifted
 * left and right as you stepped. Three things cause that, and all three are
 * fixed here, because fixing only the first leaves the wobble:
 *
 *   1. Uneven, content-influenced columns -> both are now minmax(0,1fr),
 *      which is an exact half each regardless of what is in them.
 *   2. A long code line widening its own column -> the code body scrolls
 *      horizontally inside the pane (.codebox .body) instead of growing it.
 *   3. A pane with nothing in it on some steps collapsing and springing back
 *      -> both panes carry a min-height, so an empty terminal still holds
 *      its half of the stage.
 *
 * On a projector a layout that jumps every step costs the room its place. */
.stage { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr);
         gap: 20px; align-items: start; }
.stage > * { min-width: 0; }            /* grid children must be allowed to shrink */
@media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }

.pipe { border: 1px solid var(--line); border-radius: 9px; padding: 12px; background: #fff;
        min-height: 300px; }
.stageRow { display: flex; align-items: center; gap: 10px; margin: 0 0 7px; flex-wrap: wrap; }
.stageName { font-size: .78rem; font-weight: 700; letter-spacing: .05em;
             text-transform: uppercase; color: var(--muted); width: 100%; margin-bottom: 1px;
             line-height: 1.2; }
.box { border: 2px solid var(--line); border-radius: 8px; padding: 6px 12px; min-width: 128px;
       background: #fff; transition: border-color .18s ease, box-shadow .18s ease, opacity .18s ease; }
.box .nm { font-weight: 700; font-size: .95rem; }
.box .meta { font-size: .76rem; color: var(--muted); margin-top: 1px; line-height: 1.25; }
.box.pending { border-style: dashed; opacity: .45; }
.box.src { border-color: var(--blue); background: var(--blueBg); }
.box.obj { border-color: var(--purple); background: var(--purpleBg); }
.box.exe { border-color: var(--green); background: var(--greenBg); }
.box.active { box-shadow: 0 0 0 4px rgba(230,126,34,.25); border-color: var(--orange); }
.box.bad { border-color: var(--red); background: var(--redBg); }
.arrow { color: var(--muted); font-size: 1.3rem; line-height: 1; }

.side { display: flex; flex-direction: column; gap: 12px; min-height: 300px; }
.card { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; background: #fff; }
.card h3 { margin: 0 0 .45rem; font-size: 1.15rem; }
.card p { margin: .35rem 0; line-height: 1.5; font-size: 1.05rem; }
.card .blist { margin: .3rem 0 0; padding-left: 1.15rem; }
/* The bullets ARE the explanation, so they get read from the back of the room:
   1.1rem, same as the THIS STEP pill. The heading stays a step above them so it
   still leads. Prose is not an option here -- see build_steppers.py --check,
   which fails a card paragraph long enough to be a paragraph. */
.card .blist li { margin: .38rem 0; line-height: 1.5; font-size: 1.1rem; }
.card.deeper .blist li { font-size: 1rem; }
.termwrap { border-radius: 9px; overflow: hidden; }
.termwrap .tlabel { background: #11151c; color: #7d8795; padding: 5px 12px;
                    font-family: Consolas, "SF Mono", Menlo, monospace;
                    font-size: .76rem; font-weight: 700; letter-spacing: .08em; }
.term { background: #1e2430; color: #e6e9ef; padding: 12px 14px;
        font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 1.2rem;
        line-height: 1.55; white-space: pre-wrap; min-height: 104px;
        overflow-x: auto; }
.term .cmd { color: #8fd4ff; }
.term .err { color: #ff9a8f; }
.term .ok  { color: #9ae6a4; }
.term .dim { color: #9aa4b2; }

/* Code panel. Catppuccin Mocha, the same look and size as the CS 2420
   steppers, so a student moving between courses sees one thing. */
.codebox { --code-bg:#1e1e2e; --code-fg:#cdd6f4; --code-hit:#45475a;
           border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.codebox .fn { background: #181825; color: #9399b2; padding: 6px 11px;
               font-weight: 700; font-size: .78rem;
               font-family: Consolas, "SF Mono", Menlo, monospace;
               border-bottom: 1px solid #313244; }
/* overflow-x here, not on the pane: a long line scrolls inside the code box
   rather than widening the column and squeezing the terminal. */
.codebox .body { padding: .6rem 0; overflow-x: auto; color: var(--code-fg);
                 font-family: Consolas, "Courier New", monospace;
                 font-size: 1.35rem; line-height: 1.6; }
.codebox .ln { padding: 0 .8rem; white-space: pre; }
.codebox .ln.hl { background: var(--code-hit); }
.codebox .ln.hl::before { content: "\25B8 "; color: #f9e2af; }
.codebox .ln:not(.hl)::before { content: "  "; }
/* Catppuccin Mocha token colours */
.codebox .c-com { color:#6c7086; font-style: italic; }
.codebox .c-str { color:#a6e3a1; }
.codebox .c-kw  { color:#cba6f7; }
.codebox .c-typ { color:#89b4fa; }
.codebox .c-num { color:#fab387; }
.codebox .c-pre { color:#f5c2e7; }

/* THIS STEP, inline on the executing row. Keeping it on the same line as the
   code it describes is the whole point: nothing to look back and forth
   between. Nothing else in the panel has a light background, which is what
   makes it unmistakable. */
.codebox .ln.hl { display: flex; align-items: center; flex-wrap: wrap; }
.codebox .ln.hl .src { white-space: pre; padding-right: 1.6rem; }
.codebox .calc { background: #f9e2af; color: #1e1e2e; font-weight: 600;
                 white-space: pre-wrap; border-radius: 5px;
                 padding: .1rem .75rem; font-size: 1.1rem; }
.codebox .calc::before { content: "THIS STEP"; font-size: .72rem; font-weight: 800;
                         letter-spacing: .06em; color: #4a3600;
                         background: rgba(0,0,0,.10); border-radius: 3px;
                         padding: .08rem .4rem; margin-right: .55rem; }
.codebox .calc code { background: rgba(0,0,0,.09); border-radius: 3px;
                      padding: .02em .28em; font-size: .95em; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 0;
          color: var(--muted); font-size: .82rem; }
.legend i { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line);
            border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
table.cmp { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
table.cmp th { background: #f2f4f7; }
.tag { font-weight: 700; }
.tag.okT { color: var(--green); } .tag.badT { color: var(--red); }
.card.deeper { border-left: 4px solid var(--blue); background: #f7fbfe; }
.card.deeper h3 { color: #1b5e8a; font-size: 1.02rem; }
.card.deeper p { font-size: .93rem; }
.card.action { border: 2px solid var(--green); background: var(--greenBg); }
.card.action h3 { color: #1c7e45; }
.card.action .where { font-family: Consolas, "SF Mono", Menlo, monospace;
                      font-size: .86rem; background: #fff; border: 1px solid #bfe3c9;
                      border-radius: 6px; padding: 6px 9px; display: inline-block;
                      margin: .3rem 0; }
.selftest { margin-top: 18px; font-size: .84rem; color: var(--muted); }
/* /@stepper:css */
</style>
<style>
/* This stepper only. Rules the shared template does not carry.
   The template is stamped in above by scripts/build_steppers.py
   and must not be edited here.

   @media blocks are kept WHOLE on purpose: flattening one is how
   a narrow-screen single-column fallback ended up applying on
   every screen and stacked the panes. */
header.hd { background: linear-gradient(135deg,#1e2430 0%,#2c3e50 50%,#34495e 100%); color: #fff; border-radius: 12px; padding: 1.4rem 1.7rem 1.2rem; }
header.hd .crumb { font-size: .74rem; opacity: .85; }
header.hd h1 { font-size: 1.5rem; margin: .35rem 0 .3rem; }
header.hd p { margin: 0; font-size: .93rem; opacity: .93; }
#tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0 .75rem; }
#tabs button { font: inherit; font-size: .88rem; padding: .5rem .85rem; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 8px; color: var(--ink); }
#tabs button[aria-selected="true"] { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
.bar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem; margin-bottom: .85rem; }
.bar button { font: inherit; font-size: .85rem; padding: .4rem .8rem; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 6px; }
.bar button:disabled { opacity: .4; cursor: default; }
.bar .count { font-size: .83rem; color: var(--dim); margin-left: auto; }
.todo { font-size: .83rem; color: var(--amber); background: #fff8e1; border: 1px solid #e8d9a8; border-radius: 6px; padding: .25rem .55rem; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.card p:last-child { margin-bottom: 0; }
pre.code { background: var(--dark); color: var(--code); border-radius: 8px; padding: .75rem .9rem; margin: 0; overflow-x: auto; font-family: Consolas, Menlo, monospace; font-size: .86rem; line-height: 1.6; }
pre.code .ln { color: #6b7a90; margin-right: .75rem; user-select: none; }
pre.code .on { background: rgba(249,226,175,.17); display: block; border-left: 3px solid var(--hl); margin-left: -.9rem; padding-left: calc(.9rem - 3px); }
.out { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: .7rem .8rem; overflow-x: auto; font-family: Consolas, Menlo, monospace; font-size: .95rem; line-height: 1.75; }
.out .row { white-space: pre; }
.out .pad { color: #c3ccda; }
.out .ch { color: var(--ink); }
.out .ruler { white-space: pre; color: var(--dim); font-size: .78rem; border-bottom: 1px dashed var(--line); padding-bottom: .2rem; margin-bottom: .3rem; }
.out .bad { color: var(--red); font-weight: 700; }
.term .warn { color: #f0b46a; }
.action { margin-top: .85rem; background: #f2f8f4; border-left: 5px solid var(--green); border-radius: 8px; padding: .75rem .95rem; font-size: .92rem; }
.action strong { color: var(--green); }
code { background: #eef1f6; padding: .05rem .3rem; border-radius: 4px; font-family: Consolas, Menlo, monospace; font-size: .92em; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hd">
    <div class="crumb">CS 1410 &middot; Module 1 &middot; Step Through</div>
    <h1>Lining up columns with <code style="color:#f9e2af">setw</code></h1>
    <p>Four tabs, for CT 1 Part 5. Every space is drawn, because the spaces are the whole lesson.</p>
  </header>

  <div id="tabs" role="tablist"></div>

  <div class="bar">
    <button id="prev">&laquo; Back</button>
    <button id="next">Next &raquo;</button>
    <button id="last">Last &raquo;</button>
    <span class="todo" id="todo"></span>
    <span class="count" id="frameCount"></span>
  </div>

  <div id="stage"></div>

  <div class="legend" id="legend">
    Grey dots are spaces C++ printed for you. The ruler counts characters from
    the start of the line.
  </div>

  <div class="selftest" id="selftest"></div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Every frame is a COMPLETE description of the world at that step, never a
// diff. Stepping backwards is just re-rendering, so no state can drift.
//   code:   { lines: [..], hl: index }      the source, with one line marked
//   out:    [ "text", ... ]                 what the terminal has printed
//   width:  optional ruler width to draw
//   title / body                            the explanation card
//   term:   [[class, text], ...]            shell transcript
//   action: { do, where }                   required on the LAST frame of a tab
// ---------------------------------------------------------------------------

function f(o) { return o; }

var MODES = {

  // --- 1 ------------------------------------------------------------------
  field: {
    label: "1. One field",
    frames: [
      f({ title: "setw reserves room",
          body: [
            "<code>std::setw(10)</code>: print the <em>next</em> item in a field ten characters wide",
            "&ldquo;Coffee&rdquo; is six characters, so C++ adds four spaces",
            "By default the padding goes <strong>before</strong> the text",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::setw(10) << "Coffee" << "|\\n";'
          ], hl: 0 },
          out: ["    Coffee|"], width: 10,
          term: [["cmd", "$ ./build/ct1"], ["", "    Coffee|"]] }),
      f({ title: "Change the number, change the gap",
          body: [
            "Same string, wider field",
            "The text did not move relative to the <strong>right edge</strong> &mdash; the padding grew",
            "This is why a column lines up without you counting anything",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::setw(14) << "Coffee" << "|\\n";'
          ], hl: 0 },
          out: ["        Coffee|"], width: 14,
          term: [["cmd", "$ ./build/ct1"], ["", "        Coffee|"]] }),
      f({ title: "setw never cuts anything off",
          body: [
            "&ldquo;Espresso&rdquo; is eight characters in a field of four",
            "C++ does <strong>not</strong> truncate it",
            "<code>setw</code> is a <em>minimum</em>, never a maximum",
            "One long value silently widens the column and knocks the table out of line",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::setw(4) << "Espresso" << "|\\n";'
          ], hl: 0 },
          out: ["Espresso|"], width: 4,
          term: [["cmd", "$ ./build/ct1"], ["", "Espresso|"],
                 ["warn", "# eight characters in a four-wide field. No error, no truncation."]],
          action: { do: "Pick a field width wider than your longest value, so nothing ever overflows its column.",
                    where: "src/basics.cpp &mdash; Part 5, printScoreRow" } })
    ]
  },

  // --- 2 ------------------------------------------------------------------
  once: {
    label: "2. It only applies once",
    frames: [
      f({ title: "One setw, two columns",
          body: [
            "This looks like it should produce two neat columns",
            "Watch what the second one does",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::setw(12) << "Coffee"',
            '          << "3.50" << "\\n";',
            'std::cout << std::setw(12) << "Tea"',
            '          << "12.00" << "\\n";'
          ], hl: 0 },
          out: [], width: 12,
          term: [["cmd", "$ ./build/ct1"], ["dim", "# nothing printed yet"]] }),
      f({ title: "The first column is fine",
          body: [
            "Both names sit in a twelve-wide field, right-aligned",
            "Each price therefore begins at character 13",
            "That part was never the problem",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::setw(12) << "Coffee"',
            '          << "3.50" << "\\n";',
            'std::cout << std::setw(12) << "Tea"',
            '          << "12.00" << "\\n";'
          ], hl: 1 },
          out: ["      Coffee3.50"], width: 12,
          term: [["cmd", "$ ./build/ct1"], ["", "      Coffee3.50"]] }),
      f({ title: "And the prices do not line up",
          body: [
            "<strong><code>setw</code> applies to the next item only</strong>",
            "The name used it up, so the price printed with no field at all",
            "The prices still <em>start</em> in the same place &mdash; the name field is a fixed twelve wide",
            "What is ragged is the <strong>right edge</strong>: <code>12.00</code> is wider than <code>3.50</code>",
            "On a table of numbers, the right edge is the one that matters",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::setw(12) << "Coffee"',
            '          << "3.50" << "\\n";',
            'std::cout << std::setw(12) << "Tea"',
            '          << "12.00" << "\\n";'
          ], hl: 3 },
          out: ["      Coffee3.50", "         Tea12.00"], width: 12,
          term: [["cmd", "$ ./build/ct1"], ["", "      Coffee3.50"],
                 ["", "         Tea12.00"],
                 ["warn", "# look at the RIGHT edge, not the left: 3.50 and 12.00 do not line up"]] }),
      f({ title: "Say it again for every field",
          body: [
            "One <code>setw</code> per column",
            "Both lines are the same length now, and the numbers form a real column",
            "If you remember one thing: <code>setw</code> is <strong>not sticky</strong>",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::setw(12) << "Coffee"',
            '          << std::setw(8) << "3.50" << "\\n";',
            'std::cout << std::setw(12) << "Tea"',
            '          << std::setw(8) << "2.00" << "\\n";'
          ], hl: 1 },
          out: ["      Coffee    3.50", "         Tea   12.00"], width: 20,
          term: [["cmd", "$ ./build/ct1"], ["", "      Coffee    3.50"],
                 ["", "         Tea   12.00"],
                 ["dim", "# both lines 20 characters, and the decimal points line up"]],
          action: { do: "Give every column its own setw, not just the first. printTimesTable needs one on every cell.",
                    where: "src/basics.cpp &mdash; Part 5, printTimesTable" } })
    ]
  },

  // --- 3 ------------------------------------------------------------------
  align: {
    label: "3. Left or right",
    frames: [
      f({ title: "Right is the default",
          body: [
            "Numbers belong on the right, so their digits line up by place value",
            "<code>setw</code> already does this without being asked",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::setw(8) << "3.50"  << "|\\n";',
            'std::cout << std::setw(8) << "12.00" << "|\\n";'
          ], hl: 0 },
          out: ["    3.50|", "   12.00|"], width: 8,
          term: [["cmd", "$ ./build/ct1"], ["", "    3.50|"], ["", "   12.00|"],
                 ["dim", "# decimal points line up"]] }),
      f({ title: "std::left moves the padding",
          body: [
            "Names read better flush left, so the padding goes <em>after</em> the text",
            "<code>std::left</code> is a switch, not a one-shot",
            "It stays on until you change it &mdash; unlike <code>setw</code>",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::left',
            '          << std::setw(12) << "Coffee" << "|\\n";',
            'std::cout << std::setw(12) << "Espresso" << "|\\n";'
          ], hl: 1 },
          out: ["Coffee      |", "Espresso    |"], width: 12,
          term: [["cmd", "$ ./build/ct1"], ["", "Coffee      |"],
                 ["", "Espresso    |"],
                 ["dim", "# one std::left, both lines affected"]] }),
      f({ title: "One line, both directions",
          body: [
            "A line can want the name left and the number right",
            "Flip back to <code>std::right</code> partway along",
            "Two switches, one line, and the result is a table",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::left  << std::setw(12) << "Coffee"',
            '          << std::right << std::setw(8)  << "3.50"',
            '          << "\\n";'
          ], hl: 0 },
          out: ["Coffee          3.50"], width: 20,
          term: [["cmd", "$ ./build/ct1"], ["", "Coffee          3.50"]],
          action: { do: "Use std::left for the name and std::right for the number -- 18 wide and 4 wide.",
                    where: "src/basics.cpp &mdash; Part 5, printScoreRow (TODO 5b)" } })
    ]
  },

  // --- 4 ------------------------------------------------------------------
  money: {
    label: "4. Money",
    frames: [
      f({ title: "A double prints as little as it can",
          body: [
            "These are prices, but C++ has no idea of that",
            "<code>3.5</code> is just a number",
            "The default is the shortest accurate form &mdash; so the trailing zero goes, and the decimal point with it",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'double price{3.5};',
            'std::cout << price << "\\n";'
          ], hl: 1 },
          out: ["3.5"], width: 0,
          term: [["cmd", "$ ./build/ct1"], ["", "3.5"],
                 ["warn", "# not 3.50 -- this is a price with one decimal place"]] }),
      f({ title: "fixed and setprecision together",
          body: [
            "<code>std::fixed</code>: always decimal places, never scientific notation",
            "<code>std::setprecision(2)</code>: how many places",
            "You need both &mdash; <code>setprecision</code> alone counts <em>significant digits</em>, not decimals",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'double price{3.5};',
            'std::cout << std::fixed << std::setprecision(2)',
            '          << price << "\\n";'
          ], hl: 1 },
          out: ["3.50"], width: 0,
          term: [["cmd", "$ ./build/ct1"], ["", "3.50"]] }),
      f({ title: "This one IS sticky",
          body: [
            "The second price never mentions <code>setprecision</code> and still prints two decimals",
            "<code>std::fixed</code> and <code>setprecision</code> change the stream until something changes them back",
            "The exact opposite of <code>setw</code>, which lasts one item",
            "Two things that look alike in the code and behave differently",
          ],
          todo: "Part 5 &mdash; <code>src/basics.cpp</code>, <code>printTimesTable</code>",
          code: { lines: [
            'std::cout << std::fixed << std::setprecision(2)',
            '          << 3.5 << "\\n";',
            'std::cout << 2.0 << "\\n";'
          ], hl: 2 },
          out: ["3.50", "2.00"], width: 0,
          term: [["cmd", "$ ./build/ct1"], ["", "3.50"], ["", "2.00"],
                 ["dim", "# one setprecision, both lines. setw would not have done that."]],
          action: { do: "Set fixed and setprecision(2) once, before the first price. main.cpp already does it for you.",
                    where: "src/main.cpp &mdash; given; you will need it yourself in Lab 1" } })
    ]
  },

  // --- 5 ------------------------------------------------------------------
};

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

var ORDER = ["field", "once", "align", "money"];
var mode = ORDER[0];
var step = 0;

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;");
}

/* Spaces are the lesson, so each one is drawn as a visible dot. */
function outRow(text) {
  var html = "";
  for (var i = 0; i < text.length; i++) {
    var c = text.charAt(i);
    html += c === " " ? '<span class="pad">&middot;</span>'
                      : '<span class="ch">' + esc(c) + "</span>";
  }
  return '<div class="row">' + html + "</div>";
}

function rulerRow(width) {
  if (!width) return "";
  var s = "";
  for (var i = 1; i <= width; i++) s += (i % 10 === 0) ? "|" : (i % 5 === 0 ? "+" : ".");
  return '<div class="ruler">' + s + "  " + width + "</div>";
}

function codeHTML(code) {
  var out = "";
  for (var i = 0; i < code.lines.length; i++) {
    var line = '<span class="ln">' + (i + 1) + "</span>" + esc(code.lines[i]);
    out += (i === code.hl) ? '<span class="on">' + line + "</span>" : line + "\n";
  }
  return out;
}

function termHTML(rows) {
  return rows.map(function (r) {
    return '<div class="' + (r[0] || "") + '">' + esc(r[1]) + "</div>";
  }).join("");
}

function render() {
  var frames = MODES[mode].frames;
  if (step >= frames.length) step = frames.length - 1;
  if (step < 0) step = 0;
  var fr = frames[step];

  var stage = document.getElementById("stage");
  stage.innerHTML = "";
  // The verifier looks for #stage .stage after every step, so this class is
  // load-bearing: without it, a rendered step reads as "rendered nothing".
  var root = el("div", "stage");
  // Which TODO this step serves, on every step -- the device that makes CT0
  // readable. The tabs follow the teaching; this says where you are.
  if (fr.todo) {
    var tb = el("div", "todobar");
    tb.appendChild(el("span", "tag", "THIS STEP IS FOR"));
    tb.appendChild(el("span", "what", fr.todo));
    root.appendChild(tb);
  }
  var grid = el("div", "grid");

  var left = el("div", "card");
  left.appendChild(el("h3", null, "The code"));
  var pre = el("pre", "code");
  pre.innerHTML = codeHTML(fr.code || { lines: ["(no code this step)"], hl: -1 });
  left.appendChild(pre);
  var t = el("div", "term");
  t.innerHTML = termHTML(fr.term || []);
  left.appendChild(t);

  var right = el("div", "card");
  right.appendChild(el("h3", null, fr.title));
  // Bullets, never a paragraph: this is read off a projector from the back of
  // the room. See templates/stepper/README.md.
  if (Array.isArray(fr.body)) {
    var ul = el("ul", "blist");
    fr.body.forEach(function (b) { ul.appendChild(el("li", null, b)); });
    right.appendChild(ul);
  } else {
    var body = el("p");
    body.innerHTML = fr.body;
    right.appendChild(body);
  }
  var o = el("div", "out");
  o.innerHTML = rulerRow(fr.width) +
                (fr.out.length ? fr.out.map(outRow).join("")
                               : '<div class="row"><span class="pad">(nothing printed yet)</span></div>');
  right.appendChild(o);
  if (fr.action) {
    var a = el("div", "action");
    a.innerHTML = "<strong>&#9654; Your turn:</strong> " + fr.action.do +
                  "<br /><span style='font-size:.88rem;color:#56657d'>" +
                  fr.action.where + "</span>";
    right.appendChild(a);
  }

  grid.appendChild(left);
  grid.appendChild(right);
  root.appendChild(grid);
  stage.appendChild(root);

  document.getElementById("frameCount").textContent =
    "step " + (step + 1) + " of " + frames.length;
  document.getElementById("todo").innerHTML =
    fr.action ? "ends at a TODO" : MODES[mode].label;
  // Enabled while there is anywhere left to go, including the next tab. A
  // greyed-out Next beside an arrow key that still works is a lie about where
  // the end is.
  var atTab = ORDER.indexOf(mode);
  document.getElementById("prev").disabled = (step === 0 && atTab <= 0);
  document.getElementById("next").disabled =
    (step === frames.length - 1 && atTab >= ORDER.length - 1);
  document.getElementById("last").disabled = (step === frames.length - 1);

  var tabs = document.querySelectorAll("#tabs [data-mode]");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].setAttribute("aria-selected",
      tabs[i].getAttribute("data-mode") === mode ? "true" : "false");
  }
}

function buildTabs() {
  var box = document.getElementById("tabs");
  ORDER.forEach(function (key) {
    var b = el("button", null, MODES[key].label);
    b.setAttribute("data-mode", key);
    b.setAttribute("role", "tab");
    b.addEventListener("click", function () {
      mode = key; step = 0; render();
    });
    box.appendChild(b);
  });
}

buildTabs();
/* Run off the end of a tab and into the next one.
 *
 * Presenting means holding the right arrow and talking. Stopping dead on the
 * last step of every tab breaks that: you have to look down, find the mouse,
 * and click the next tab in front of the room. The arrows treat the whole
 * stepper as one sequence.
 *
 * This stepper has its own engine (mode/step rather than state.mode/state.i),
 * so the logic is written out again here. That duplication is the argument
 * for extracting the engine into templates/stepper/ the way the CSS already
 * is -- noted, not done.
 */
function advance(delta) {
  var t = step + delta;
  if (t >= 0 && t < MODES[mode].frames.length) { step = t; render(); return; }
  var at = ORDER.indexOf(mode), to = at + delta;
  // The two real ends of the deck: stay put rather than wrap, so a held key
  // cannot silently cycle back to the beginning mid-explanation.
  if (at < 0 || to < 0 || to >= ORDER.length) return;
  mode = ORDER[to];
  step = delta < 0 ? MODES[mode].frames.length - 1 : 0;
  render();                       // render() owns the tab highlight
}

document.getElementById("prev").addEventListener("click", function () { advance(-1); });
document.getElementById("next").addEventListener("click", function () { advance(1); });

// This stepper shipped with no keyboard navigation at all, which only showed
// up once the arrow keys were given something new to do.
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight") { advance(1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { advance(-1); e.preventDefault(); }
});
document.getElementById("last").addEventListener("click", function () {
  step = MODES[mode].frames.length - 1; render();
});

// ---------------------------------------------------------------------------
// Self-test. Silent when it passes; impossible to miss when it does not.
// It checks the SHAPE of every frame and, more importantly, the TEACHING
// POINTS -- so an edit that quietly breaks a lesson fails loudly instead of
// shipping as a slideshow that no longer demonstrates anything.
// ---------------------------------------------------------------------------
(function () {
  var fails = [];
  function ok(cond, msg) { if (!cond) fails.push(msg); }
  function width(s) { return s.length; }

  ok(ORDER.length === 4, "expected four tabs");
  ORDER.forEach(function (m) {
    ok(!!MODES[m], m + ": tab missing from MODES");
    var fs = (MODES[m] || {}).frames || [];
    ok(fs.length > 0, m + ": has frames");
    fs.forEach(function (fr, i) {
      var where = m + " frame " + (i + 1);
      ok(!!fr.title && !!fr.body, where + ": needs a title and a body");
      ok(Array.isArray(fr.out), where + ": needs an out array");
      ok(Array.isArray(fr.term) && fr.term.length > 0, where + ": needs terminal output");
      if (fr.code) {
        ok(fr.code.hl < fr.code.lines.length, where + ": highlight line out of range");
      }
    });
    // Same rule as CT0's stepper: a tab that does not hand off to a TODO has
    // quietly become a slideshow that ends nowhere.
    var last = fs[fs.length - 1];
    ok(!!last && !!last.action, m + ": last frame must hand off to a TODO");
    if (last && last.action) {
      ok(!!last.action.do && !!last.action.where,
         m + ": hand-off needs both an instruction and a file location");
    }
  });

  // Tab 1's point: setw is a MINIMUM. The overflow frame must print more
  // characters than the field it was given, or it is not showing anything.
  var over = MODES.field.frames[2];
  ok(over.out.length === 1 && width(over.out[0]) > over.width,
     "tab 1: the overflow frame must print wider than its setw");

  // Tab 2 is the whole stepper. The broken frame must have lines of DIFFERENT
  // lengths (that is the bug being visible) and the fixed frame must have
  // lines of the SAME length (that is it being fixed).
  var broken = MODES.once.frames[2];
  ok(broken.out.length === 2 && width(broken.out[0]) !== width(broken.out[1]),
     "tab 2: the broken frame must show two lines of different lengths");
  var fixed = MODES.once.frames[3];
  ok(fixed.out.length === 2 && width(fixed.out[0]) === width(fixed.out[1]),
     "tab 2: the fixed frame must show two lines of equal length");

  // Tab 4's point: setprecision is sticky where setw is not. The last frame
  // must show two lines that BOTH carry two decimals from one setprecision.
  var sticky = MODES.money.frames[2];
  ok(sticky.out.length === 2 &&
     /\.\d\d$/.test(sticky.out[0]) && /\.\d\d$/.test(sticky.out[1]),
     "tab 4: the sticky frame must show two lines both at two decimals");

  // There was a fifth tab here that walked the finished receipt line by line.
  // It was removed when this stepper moved from the Lab 1 repo to CT 1's: it
  // was the Lab's answer, and these publish to a public URL. The teaching it
  // carried -- named widths, one setw per column -- is in tabs 1 and 2.

  var node = document.getElementById("selftest");
  if (!fails.length) { node.style.display = "none"; return; }
  node.style.display = "";
  node.style.color = "#c0392b";
  node.style.fontWeight = "700";
  node.textContent = "Stepper self-test: " + fails.length +
                     " problem(s) -- " + fails.join("; ");
})();

render();
</script>
</body>
</html>
