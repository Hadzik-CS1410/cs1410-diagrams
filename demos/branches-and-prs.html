<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 1410 &middot; Branches &amp; Pull Requests, one step at a time</title>
<style>
/* @stepper:css */
/* stepper.css -- the canonical look of every CS 1410 stepper.
 *
 * Do not edit this inside a stepper. Edit it HERE, then run
 * `python scripts/build_steppers.py`, which inlines it into every stepper
 * between its @stepper:css markers. `--check` reports drift. Same contract as
 * templates/cpp-starter/ and sync_tooling.py, and for the same reason: there
 * will be two steppers a week for twelve weeks, and twenty-five hand-copied
 * copies of a 900-line file drift by the sixth one.
 *
 * Sizes, colours and spacing are CT0's (hello-cpp), kept deliberately: it is
 * the one that has been shown on a projector and it reads from the back.
 */

:root {
  --ink: #2c3e50; --muted: #5b6b7a; --line: #d7dae0; --bg: #fcfcfd;
  --blue: #2980b9; --blueBg: #eaf2f8;
  --purple: #8e44ad; --purpleBg: #f5eef8;
  --green: #27ae60; --greenBg: #f0faf0;
  --orange: #e67e22; --orangeBg: #fff3e0;
  --red: #c0392b; --redBg: #fdecea;
}
* { box-sizing: border-box; }

/* Reserve the scrollbar's space, always.
 *
 * This is the real cause of the panes shifting. When one step is short and the
 * next is tall, the page's vertical scrollbar appears -- and the viewport
 * instantly narrows by ~15px, so every column shifts left. It looks like the
 * layout is moving; what moved is the window. In CT0 it happens between steps
 * 3 and 4 of the first tab.
 *
 * Reserving the gutter means the scrollbar costs its width whether or not it
 * is there, so appearing can never move anything. The @supports fallback is
 * for engines without scrollbar-gutter, where always painting a track does
 * the same job less elegantly.
 *
 * This makes the shift impossible. It does NOT make a too-tall step acceptable
 * -- see the one-screen rule in templates/stepper/README.md, which
 * verify_stepper.js enforces. */
html { scrollbar-gutter: stable; }
@supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }

/* Tight furniture. 342px of the 760px one-screen budget used to be chrome
   before a single line of content -- padding, heading, tabs, controls,
   legend. Trimming it buys ~74px for teaching on EVERY step of every
   stepper, which is a better trade than cutting an explanation. */
body { margin: 0; padding: 14px 16px 20px;
       font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
       color: var(--ink); background: #fff; }
/* No max-width. These run the full browser width and read far better for it --
   code, terminal and explanation side by side instead of stacked. */
.wrap { margin: 0 auto; }
h1 { font-size: 1.35rem; margin: 0 0 .35rem; }
.sub { color: var(--muted); margin: 0 0 .6rem; line-height: 1.5; font-size: .9rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        border-bottom: 2px solid var(--line); padding-bottom: 7px; margin-bottom: 10px; }
.tabs button { font-size: .95rem; font-weight: 600; cursor: pointer; padding: 8px 14px;
               border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.spacer { flex: 1; }
.hint { color: var(--muted); font-size: .85rem; }
.panel { border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
         padding: 7px 12px; margin-bottom: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lbl { font-weight: 700; font-size: .85rem; color: var(--muted);
       text-transform: uppercase; letter-spacing: .04em; min-width: 54px; }
.ctl { font: inherit; cursor: pointer; padding: 6px 12px; border: 1px solid var(--line);
       border-radius: 6px; background: #fff; color: var(--ink); }
.ctl:disabled { opacity: .4; cursor: default; }
.ctl.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
.count { margin-left: auto; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

/* Names the TODO the current step is for, on EVERY step. The hand-off card at
   the end of a tab says "go write it"; this says "this is the one" the whole
   way through. */
.todobar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           background: #fff8e1; border-left: 5px solid #8f6a00;
           border-radius: 0 8px 8px 0; padding: .35rem .85rem; margin-bottom: 10px;
           min-height: 40px; }
.todobar .tag { background: #8f6a00; color: #fff; border-radius: 4px;
                padding: .1rem .5rem; font-size: .76rem; letter-spacing: .05em; }
.todobar .what { font-size: 1rem; }
.todobar code { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: .89rem; }

/* ------------------------------------------------------------------ THE SPLIT
 * Code on the left, terminal and explanation on the right, EVENLY, and the
 * divide does not move from step to step.
 *
 * It used to be `minmax(0,1.2fr) minmax(0,1fr)`, and the panes visibly shifted
 * left and right as you stepped. Three things cause that, and all three are
 * fixed here, because fixing only the first leaves the wobble:
 *
 *   1. Uneven, content-influenced columns -> both are now minmax(0,1fr),
 *      which is an exact half each regardless of what is in them.
 *   2. A long code line widening its own column -> the code body scrolls
 *      horizontally inside the pane (.codebox .body) instead of growing it.
 *   3. A pane with nothing in it on some steps collapsing and springing back
 *      -> both panes carry a min-height, so an empty terminal still holds
 *      its half of the stage.
 *
 * On a projector a layout that jumps every step costs the room its place. */
.stage { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr);
         gap: 20px; align-items: start; }
.stage > * { min-width: 0; }            /* grid children must be allowed to shrink */
@media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }

.pipe { border: 1px solid var(--line); border-radius: 9px; padding: 12px; background: #fff;
        min-height: 300px; }
.stageRow { display: flex; align-items: center; gap: 10px; margin: 0 0 7px; flex-wrap: wrap; }
.stageName { font-size: .78rem; font-weight: 700; letter-spacing: .05em;
             text-transform: uppercase; color: var(--muted); width: 100%; margin-bottom: 1px;
             line-height: 1.2; }
.box { border: 2px solid var(--line); border-radius: 8px; padding: 6px 12px; min-width: 128px;
       background: #fff; transition: border-color .18s ease, box-shadow .18s ease, opacity .18s ease; }
.box .nm { font-weight: 700; font-size: .95rem; }
.box .meta { font-size: .76rem; color: var(--muted); margin-top: 1px; line-height: 1.25; }
.box.pending { border-style: dashed; opacity: .45; }
.box.src { border-color: var(--blue); background: var(--blueBg); }
.box.obj { border-color: var(--purple); background: var(--purpleBg); }
.box.exe { border-color: var(--green); background: var(--greenBg); }
.box.active { box-shadow: 0 0 0 4px rgba(230,126,34,.25); border-color: var(--orange); }
.box.bad { border-color: var(--red); background: var(--redBg); }
.arrow { color: var(--muted); font-size: 1.3rem; line-height: 1; }

.side { display: flex; flex-direction: column; gap: 12px; min-height: 300px; }
.card { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; background: #fff; }
.card h3 { margin: 0 0 .45rem; font-size: 1.15rem; }
.card p { margin: .35rem 0; line-height: 1.5; font-size: 1.05rem; }
.card .blist { margin: .3rem 0 0; padding-left: 1.15rem; }
/* The bullets ARE the explanation, so they get read from the back of the room:
   1.1rem, same as the THIS STEP pill. The heading stays a step above them so it
   still leads. Prose is not an option here -- see build_steppers.py --check,
   which fails a card paragraph long enough to be a paragraph. */
.card .blist li { margin: .38rem 0; line-height: 1.5; font-size: 1.1rem; }
.card.deeper .blist li { font-size: 1rem; }
.termwrap { border-radius: 9px; overflow: hidden; }
.termwrap .tlabel { background: #11151c; color: #7d8795; padding: 5px 12px;
                    font-family: Consolas, "SF Mono", Menlo, monospace;
                    font-size: .76rem; font-weight: 700; letter-spacing: .08em; }
.term { background: #1e2430; color: #e6e9ef; padding: 12px 14px;
        font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 1.2rem;
        line-height: 1.55; white-space: pre-wrap; min-height: 104px;
        overflow-x: auto; }
.term .cmd { color: #8fd4ff; }
.term .err { color: #ff9a8f; }
.term .ok  { color: #9ae6a4; }
.term .dim { color: #9aa4b2; }

/* Code panel. Catppuccin Mocha, the same look and size as the CS 2420
   steppers, so a student moving between courses sees one thing. */
.codebox { --code-bg:#1e1e2e; --code-fg:#cdd6f4; --code-hit:#45475a;
           border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.codebox .fn { background: #181825; color: #9399b2; padding: 6px 11px;
               font-weight: 700; font-size: .78rem;
               font-family: Consolas, "SF Mono", Menlo, monospace;
               border-bottom: 1px solid #313244; }
/* overflow-x here, not on the pane: a long line scrolls inside the code box
   rather than widening the column and squeezing the terminal. */
.codebox .body { padding: .6rem 0; overflow-x: auto; color: var(--code-fg);
                 font-family: Consolas, "Courier New", monospace;
                 font-size: 1.35rem; line-height: 1.6; }
.codebox .ln { padding: 0 .8rem; white-space: pre; }
.codebox .ln.hl { background: var(--code-hit); }
.codebox .ln.hl::before { content: "\25B8 "; color: #f9e2af; }
.codebox .ln:not(.hl)::before { content: "  "; }
/* Catppuccin Mocha token colours */
.codebox .c-com { color:#6c7086; font-style: italic; }
.codebox .c-str { color:#a6e3a1; }
.codebox .c-kw  { color:#cba6f7; }
.codebox .c-typ { color:#89b4fa; }
.codebox .c-num { color:#fab387; }
.codebox .c-pre { color:#f5c2e7; }

/* THIS STEP, inline on the executing row. Keeping it on the same line as the
   code it describes is the whole point: nothing to look back and forth
   between. Nothing else in the panel has a light background, which is what
   makes it unmistakable. */
.codebox .ln.hl { display: flex; align-items: center; flex-wrap: wrap; }
.codebox .ln.hl .src { white-space: pre; padding-right: 1.6rem; }
.codebox .calc { background: #f9e2af; color: #1e1e2e; font-weight: 600;
                 white-space: pre-wrap; border-radius: 5px;
                 padding: .1rem .75rem; font-size: 1.1rem; }
.codebox .calc::before { content: "THIS STEP"; font-size: .72rem; font-weight: 800;
                         letter-spacing: .06em; color: #4a3600;
                         background: rgba(0,0,0,.10); border-radius: 3px;
                         padding: .08rem .4rem; margin-right: .55rem; }
.codebox .calc code { background: rgba(0,0,0,.09); border-radius: 3px;
                      padding: .02em .28em; font-size: .95em; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 0;
          color: var(--muted); font-size: .82rem; }
.legend i { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line);
            border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
table.cmp { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
table.cmp th { background: #f2f4f7; }
.tag { font-weight: 700; }
.tag.okT { color: var(--green); } .tag.badT { color: var(--red); }
.card.deeper { border-left: 4px solid var(--blue); background: #f7fbfe; }
.card.deeper h3 { color: #1b5e8a; font-size: 1.02rem; }
.card.deeper p { font-size: .93rem; }
.card.action { border: 2px solid var(--green); background: var(--greenBg); }
.card.action h3 { color: #1c7e45; }
.card.action .where { font-family: Consolas, "SF Mono", Menlo, monospace;
                      font-size: .86rem; background: #fff; border: 1px solid #bfe3c9;
                      border-radius: 6px; padding: 6px 9px; display: inline-block;
                      margin: .3rem 0; }
.selftest { margin-top: 18px; font-size: .84rem; color: var(--muted); }
/* /@stepper:css */
</style>
<style>
/* This stepper only. Rules the shared template does not carry.
   The template is stamped in above by scripts/build_steppers.py
   and must not be edited here.

   @media blocks are kept WHOLE on purpose: flattening one is how
   a narrow-screen single-column fallback ended up applying on
   every screen and stacked the panes. */
.stage > .pipe { grid-column: 1; }
.stage > .aside { grid-column: 1; }
.stage > .side { grid-column: 2; grid-row: 1 / span 2; }
@media (max-width: 820px) { .stage { grid-template-columns: 1fr; } .stage > .pipe { grid-column: 1; order: 1; } .stage > .side { grid-column: 1; grid-row: auto; order: 2; } .stage > .aside { grid-column: 1; order: 3; } }
.where { font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.lane { display: flex; align-items: center; gap: .55rem; margin: 0 0 .7rem; flex-wrap: wrap; }
.lane .nm { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: .95rem; font-weight: 700; min-width: 7.5rem; }
.lane .nm.branch { color: var(--purple); }
.lane .nm.main { color: var(--blue); }
.dot { width: 1.55rem; height: 1.55rem; border-radius: 50%; border: 2px solid var(--line); background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 700; color: var(--muted); }
.dot.on-main { border-color: var(--blue); background: var(--blueBg); color: #1b5e8a; }
.dot.on-branch { border-color: var(--purple); background: var(--purpleBg); color: #6c3483; }
.dot.fresh { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(230,126,34,.22); }
.conn { color: var(--line); font-size: 1.1rem; }
.head { background: var(--ink); color: #fff; border-radius: 4px; padding: .1rem .45rem; font-size: .7rem; font-weight: 800; letter-spacing: .05em; }
.lane .none { color: var(--muted); font-style: italic; font-size: .9rem; }
.pushed { font-size: .74rem; font-weight: 700; border-radius: 999px; padding: .1rem .55rem; background: #e8f5e9; color: #1c7e45; border: 1px solid #bfe3c9; }
.notpushed { font-size: .74rem; font-weight: 700; border-radius: 999px; padding: .1rem .55rem; background: #f2f4f7; color: #6b7684; border: 1px dashed #c7ccd4; }
.sep { border: 0; border-top: 1px dashed var(--line); margin: .9rem 0; }
.prcard { border: 2px solid var(--line); border-radius: 9px; padding: .7rem .9rem; margin-top: .4rem; background: #fff; }
.prcard.open { border-color: var(--green); background: var(--greenBg); }
.prcard.merged { border-color: var(--purple); background: var(--purpleBg); }
.prcard .t { font-weight: 800; font-size: .98rem; }
.prcard .meta { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: .88rem; color: #1b5e8a; margin-top: .25rem; }
.prcard .state { font-size: .74rem; font-weight: 800; letter-spacing: .05em; border-radius: 999px; padding: .1rem .6rem; margin-left: .4rem; }
.prcard.open .state { background: var(--green); color: #fff; }
.prcard.merged .state { background: var(--purple); color: #fff; }
.prcard .prnote { background: #f9e2af; color: #1e1e2e; font-weight: 600; line-height: 1.45; border-radius: 5px; padding: .3rem .75rem; margin-top: .5rem; font-size: 1.02rem; }
.prcard .prnote::before { content: "THIS STEP"; font-size: .72rem; font-weight: 800; letter-spacing: .06em; color: #4a3600; background: rgba(0,0,0,.10); border-radius: 3px; padding: .08rem .4rem; margin-right: .55rem; }
.review { border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: 0 8px 8px 0; background: #fffaf3; padding: .7rem .9rem; margin-top: .8rem; }
.review .who { font-weight: 800; font-size: .95rem; }
.review .who .when { font-weight: 400; color: var(--muted); margin-left: .4rem; font-size: .82rem; }
.review .on { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: .85rem; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: .15rem .5rem; display: inline-block; margin: .35rem 0 .1rem; }
.review .what { font-size: 1.05rem; line-height: 1.5; margin: .35rem 0 0; }
.review .reply { margin: .55rem 0 0; font-size: .97rem; color: #1c7e45; font-weight: 700; }
.codebox .ln.add { background: rgba(64,160,43,.22); color: #b7f0a8; }
.codebox .ln.del { background: rgba(192,57,43,.20); color: #ffb3aa; }
.card.action .whereto { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: .86rem; background: #fff; border: 1px solid #bfe3c9; border-radius: 6px; padding: 6px 9px; display: inline-block; margin: .3rem 0; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Branches &amp; Pull Requests &mdash; one step at a time</h1>
  <p class="sub">
    You already know <code>commit</code> and <code>push</code>. This is the next piece: working on a
    <strong>branch</strong>, then opening a <strong>pull request</strong> so the change can be read before it
    joins <code>main</code>. <strong>Take the tabs in order.</strong>
  </p>

  <div class="tabs" id="tabs">
    <button data-mode="line" aria-selected="true">1 &middot; What a repo looks like</button>
    <button data-mode="branch">2 &middot; Branching</button>
    <button data-mode="pr">3 &middot; The pull request</button>
    <button data-mode="oops">4 &middot; When it goes wrong</button>
  </div>

  <div class="panel">
    <div class="row">
      <span class="lbl">Step</span>
      <button class="ctl" id="first">&laquo; First</button>
      <button class="ctl" id="prev">&lsaquo; Prev</button>
      <button class="ctl primary" id="play">&#9654; Play</button>
      <button class="ctl" id="next">Next &rsaquo;</button>
      <button class="ctl" id="last">Last &raquo;</button>
      <span class="count" id="frameCount"></span>
    </div>
  </div>

  <div id="stage"></div>
  <div class="legend" id="legend"></div>
  <div class="selftest" id="selftest"></div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Each frame is the whole world at that step, not a diff from the last one --
// so stepping backwards is just re-rendering and no state can drift.
//
//   local / remote : [{name, kind, commits:[{id, fresh}], head}]
//   pr             : null | {state:"open"|"merged", title, files, adds, dels}
//   diff           : optional [{t:"add"|"del"|"ctx", s:"text"}]
//   term           : [[class, text], ...]
//   title / body   : the explanation card (body is a bullet array)
//   lineNote       : THIS STEP, inline on the highlighted diff row
//   prNote         : THIS STEP, inside the pull-request card
//   review         : optional {who, when, on, what, reply} -- a person's comment
//   more           : optional "going deeper" bullets
//   action         : the hand-off on a tab's last step
// ---------------------------------------------------------------------------

function f(o) { return o; }
function C(n, fresh) { var a = []; for (var i = 1; i <= n; i++) a.push({ id: i, fresh: fresh === i }); return a; }

var MODES = {

// ===========================================================================
line: {
  label: "What a repo looks like",
  frames: [
    f({ todo: "Before you branch &mdash; know what you already have",
        local:  [{ name: "main", kind: "main", commits: C(3), head: true }],
        remote: [{ name: "main", kind: "main", commits: C(3), pushed: true }],
        term: [["cmd", "$ git log --oneline"],
               ["", "c3d4e5f (HEAD -&gt; main, origin/main) add the receipt total"],
               ["", "b2c3d4e print the header"],
               ["", "a1b2c3d first commit"]],
        title: "A repo is a line of commits",
        body: ["Each <strong>commit</strong> is one saved snapshot of your files.",
               "<strong>The picture and the command run opposite ways</strong>, and both are normal: the lanes above put the <strong>oldest on the left</strong>, <code>git log</code> puts the <strong>newest at the top</strong>.",
               "<strong>The names in brackets are the whole lesson.</strong> They are not part of the commit &mdash; they are labels stuck onto it.",
               "<code>main</code> is a <strong>name pointing at the newest commit</strong>. <code>HEAD -&gt; main</code> means &ldquo;you are working on <code>main</code>&rdquo;.",
               "<code>origin/main</code> is <strong>GitHub&rsquo;s copy</strong> of that name. Right now all three sit on the same commit. Watch what happens to them."],
        more: ["<strong>Which end is the newest?</strong> Diagrams of commits almost always run left to right, oldest first &mdash; GitHub&rsquo;s network graph does, and so does every drawing in this stepper. <code>git log</code> does the opposite and prints newest first, because when you run it you usually want the last thing you did. Neither is wrong; just check which one you are reading before deciding something has gone backwards.",
               "<strong>Why do tutorials show this without the brackets?</strong> Because they pipe the output somewhere. <code>git log</code> prints those labels when it is writing to your terminal and hides them when something else is reading &mdash; that is the <code>log.decorate=auto</code> default. In your terminal, you will see them."] }),

    f({ todo: "Before you branch &mdash; know what you already have",
        local:  [{ name: "main", kind: "main", commits: C(3), head: true, dirty: true }],
        remote: [{ name: "main", kind: "main", commits: C(3), pushed: true }],
        term: [["cmd", "$ git status"],
               ["err", "  modified:   src/main.cpp"],
               ["dim", "no changes added to commit"]],
        title: "Editing a file changes nothing yet",
        body: ["You saved the file, but git has <strong>not recorded anything</strong>.",
               "The line of commits is exactly as long as it was.",
               "Nothing is safe until you commit."] }),

    f({ todo: "Before you branch &mdash; know what you already have",
        local:  [{ name: "main", kind: "main", commits: C(4, 4), head: true }],
        remote: [{ name: "main", kind: "main", commits: C(3), pushed: true }],
        term: [["cmd", "$ git add ."],
               ["cmd", "$ git commit -m &quot;add the tax line&quot;"],
               ["ok", "[main d4e5f6g] add the tax line"],
               ["dim", " 1 file changed, 6 insertions(+)"],
               ["cmd", "$ git log --oneline -2"],
               ["", "d4e5f6g (HEAD -&gt; main) add the tax line"],
               ["", "c3d4e5f (origin/main) add the receipt total"]],
        title: "Commit adds a dot &mdash; on your computer only",
        body: ["Two commands: <code>add</code> <strong>chooses what goes in</strong>, <code>commit</code> <strong>saves it</strong>.",
               "A fourth commit now exists <strong>locally</strong>.",
               "<strong>The labels came apart.</strong> <code>main</code> moved to the new commit; <code>origin/main</code> stayed behind on the old one.",
               "That gap <em>is</em> &ldquo;you have something GitHub does not&rdquo;. <strong>Commit saves. Push shares.</strong>"],

// Render
// ---------------------------------------------------------------------------
var state = { mode: "line", i: 0, timer: null };

function el(tag, cls, html) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}
/* One card per step.
 *
 * A step used to stack the explanation, the optional "Going deeper" card and
 * the "Your turn" hand-off on top of one another. Three cards plus a terminal
 * do not fit on a projector screen -- which is where the page scrollbar came
 * from, and the scrollbar narrowing the viewport is what shifted the columns.
 *
 * So a frame carrying more than one card is expanded into consecutive steps,
 * one card each, all sharing the same code, terminal and TODO bar. The left
 * half of the screen does not move at all across them; only the card changes,
 * which is calm to watch and gives the room one thing to read at a time.
 *
 * Done here rather than in the frame data so every tab gets it for free, no
 * frame has to be written twice, and the self-test still sees the frames as
 * authored.
 */
function expand(list) {
  var out = [];
  list.forEach(function (fr) {
    var tail = [];
    if (fr.more) tail.push("more");
    if (fr.action) tail.push("action");
    if (!tail.length) { out.push(fr); return; }

    var head = {};
    Object.keys(fr).forEach(function (k) {
      if (k !== "more" && k !== "action") head[k] = fr[k];
    });
    out.push(head);

    tail.forEach(function (which) {
      var step = {};
      // Everything the left pane and the terminal need, so they hold still.
      Object.keys(head).forEach(function (k) {
        if (k !== "title" && k !== "body") step[k] = head[k];
      });
      step[which] = fr[which];
      out.push(step);
    });
  });
  return out;
}

function frames() { return expand(MODES[state.mode].frames); }

function asList(body) {
  if (!Array.isArray(body)) return el("p", null, body);
  var ul = el("ul", "blist");
  body.forEach(function (b) { ul.appendChild(el("li", null, b)); });
  return ul;
}

function drawLanes(where, lanes, box, other) {
  box.appendChild(el("div", "where", where));
  if (!lanes || !lanes.length) {
    box.appendChild(el("div", "lane", '<span class="none">nothing here yet</span>'));
    return;
  }
  var isLocal = where.indexOf("COMPUTER") >= 0;
  lanes.forEach(function (ln) {
    var row = el("div", "lane");
    row.appendChild(el("span", "nm " + ln.kind, ln.name));
    if (!ln.commits.length) {
      row.appendChild(el("span", "none", "no commits"));
    } else {
      ln.commits.forEach(function (c, i) {
        if (i) row.appendChild(el("span", "conn", "&mdash;"));
        var cls = "dot " + (ln.kind === "main" ? "on-main" : "on-branch") + (c.fresh ? " fresh" : "");
        row.appendChild(el("span", cls, String(c.id)));
      });
    }
    if (ln.head) row.appendChild(el("span", "head", "HEAD"));
    if (ln.dirty) row.appendChild(el("span", "notpushed", "unsaved edits"));

    // The badge compares the two copies rather than guessing. An earlier
    // version marked every local lane "not pushed" because `pushed` only ever
    // lived on the remote side -- so main looked out of sync when it was not.
    if (isLocal) {
      var twin = (other || []).filter(function (o) { return o.name === ln.name; })[0];
      if (!twin) {
        row.appendChild(el("span", "notpushed", "not on GitHub yet"));
      } else if (ln.commits.length > twin.commits.length) {
        row.appendChild(el("span", "notpushed",
          (ln.commits.length - twin.commits.length) + " not pushed"));
      } else if (ln.commits.length < twin.commits.length) {
        row.appendChild(el("span", "notpushed", "behind GitHub"));
      } else {
        row.appendChild(el("span", "pushed", "in sync"));
      }
    }
    box.appendChild(row);
  });
}

function render() {
  renderLegend();
  var fr = frames()[state.i];
  var stage = document.getElementById("stage");
  stage.innerHTML = "";

  if (fr.todo) {
    var tb = el("div", "todobar");
    tb.appendChild(el("span", "tag", "THIS STEP IS FOR"));
    tb.appendChild(el("span", "what", fr.todo));
    stage.appendChild(tb);
  }

  var grid = el("div", "stage");
  var pipe = el("div", "pipe");
  drawLanes("YOUR COMPUTER", fr.local, pipe, fr.remote);
  pipe.appendChild(el("hr", "sep"));
  drawLanes("GITHUB", fr.remote, pipe, fr.local);

  if (fr.pr) {
    var pc = el("div", "prcard " + fr.pr.state);
    pc.appendChild(el("div", "t", "Pull request &#35;1 &mdash; " + fr.pr.title +
      '<span class="state">' + fr.pr.state.toUpperCase() + "</span>"));
    pc.appendChild(el("div", "meta", fr.pr.files + " changed file" +
      (fr.pr.files === 1 ? "" : "s") + " with " + fr.pr.adds + " addition" +
      (fr.pr.adds === 1 ? "" : "s") + " and " + fr.pr.dels + " deletion" +
      (fr.pr.dels === 1 ? "" : "s")));
    if (fr.prNote) pc.appendChild(el("div", "prnote", fr.prNote));
    pipe.appendChild(pc);
  }

  if (fr.diff) {
    var cb = el("div", "codebox");
    cb.appendChild(el("div", "fn", "Files changed"));
    var body = el("div", "body");
    fr.diff.forEach(function (d, i) {
      var cls = "ln " + (d.t === "add" ? "add" : d.t === "del" ? "del" : "");
      if (i === fr.diffHl && fr.lineNote) {
        var row = el("div", cls + " hl");
        row.appendChild(el("span", "src", d.s));
        row.appendChild(el("span", "calc", fr.lineNote));
        body.appendChild(row);
      } else {
        body.appendChild(el("div", cls, d.s));
      }
    });
    cb.appendChild(body);
    pipe.appendChild(cb);
  }

  // A review comment is drawn as its own card under the diff rather than as a
  // lineNote: lineNote means "the stepper is pointing at this", and a comment
  // from a person has to read as somebody else's voice, not the narrator's.
  if (fr.review) {
    var rv = el("div", "review");
    rv.appendChild(el("div", "who", fr.review.who +
      '<span class="when">' + fr.review.when + "</span>"));
    if (fr.review.on) rv.appendChild(el("div", "on", fr.review.on));
    rv.appendChild(el("p", "what", fr.review.what));
    if (fr.review.reply) rv.appendChild(el("p", "reply", fr.review.reply));
    pipe.appendChild(rv);
  }
  grid.appendChild(pipe);

  var side = el("div", "side");
  var tw = el("div", "termwrap");
  tw.appendChild(el("div", "tlabel", "TERMINAL"));
  var term = el("div", "term");
  fr.term.forEach(function (p) {
    var sp = document.createElement("span");
    if (p[0]) sp.className = p[0];
    sp.innerHTML = p[1] + "\n";
    term.appendChild(sp);
  });
  tw.appendChild(term);
  side.appendChild(tw);

  if (fr.body) {
    var card = el("div", "card");
    card.appendChild(el("h3", null, fr.title));
    card.appendChild(asList(fr.body));
    side.appendChild(card);
  }

  if (fr.action) {
    var ac = el("div", "card action");
    ac.appendChild(el("h3", null, "&#9654; Your turn"));
    ac.appendChild(el("p", null, fr.action.do));
    if (fr.action.whereto) ac.appendChild(el("div", "whereto", fr.action.whereto));
    if (fr.action.note) ac.appendChild(el("p", null, fr.action.note));
    side.appendChild(ac);
  }
  grid.appendChild(side);

  // Under the picture, not on top of the explanation: the left column is empty
  // on most frames, and this is the one card a reader can skip.
  if (fr.more) {
    var aside = el("div", "aside");
    var mc = el("div", "card deeper");
    mc.appendChild(el("h3", null, "&#8627; Going deeper &mdash; optional"));
    mc.appendChild(asList(fr.more));
    aside.appendChild(mc);
    grid.appendChild(aside);
  }
  stage.appendChild(grid);

  document.getElementById("frameCount").textContent =
    MODES[state.mode].label + "  -  step " + (state.i + 1) + " of " + frames().length;
  document.getElementById("first").disabled = state.i === 0;
  document.getElementById("prev").disabled = state.i === 0;
  document.getElementById("next").disabled = state.i >= frames().length - 1;
  document.getElementById("last").disabled = state.i >= frames().length - 1;
}

// Only the markers this tab actually uses.
function renderLegend() {
  var node = document.getElementById("legend");
  node.innerHTML = "";
  var anyBranch = false, anyFresh = false, anyPR = false;
  MODES[state.mode].frames.forEach(function (fr) {
    (fr.local || []).concat(fr.remote || []).forEach(function (ln) {
      if (ln.kind === "branch") anyBranch = true;
      ln.commits.forEach(function (c) { if (c.fresh) anyFresh = true; });
    });
    if (fr.pr) anyPR = true;
  });
  var e = [["border-color:#2980b9;background:#eaf2f8", "a commit on <code>main</code>"]];
  if (anyBranch) e.push(["border-color:#8e44ad;background:#f5eef8", "a commit on your branch"]);
  if (anyFresh) e.push(["border-color:#e67e22", "just happened"]);
  if (anyPR) e.push(["border-color:#27ae60;background:#f0faf0", "the pull request"]);
  e.forEach(function (x) {
    var sp = document.createElement("span");
    sp.innerHTML = '<i style="' + x[0] + '"></i>' + x[1];
    node.appendChild(sp);
  });
}

function go(i) { state.i = Math.max(0, Math.min(frames().length - 1, i)); render(); }
function stop() { if (state.timer) { clearInterval(state.timer); state.timer = null; }
                  document.getElementById("play").innerHTML = "&#9654; Play"; }
function play() {
  if (state.timer) { stop(); return; }
  if (state.i >= frames().length - 1) state.i = 0;
  document.getElementById("play").innerHTML = "&#10073;&#10073; Pause";
  state.timer = setInterval(function () {
    if (state.i >= frames().length - 1) { stop(); return; }
    go(state.i + 1);
  }, 2100);
}

document.getElementById("first").addEventListener("click", function () { stop(); go(0); });
document.getElementById("prev").addEventListener("click", function () { stop(); go(state.i - 1); });
document.getElementById("next").addEventListener("click", function () { stop(); go(state.i + 1); });
document.getElementById("last").addEventListener("click", function () { stop(); go(frames().length - 1); });
document.getElementById("play").addEventListener("click", play);

Array.prototype.forEach.call(document.querySelectorAll("#tabs [data-mode]"), function (b) {
  b.addEventListener("click", function () {
    stop();
    state.mode = b.getAttribute("data-mode");
    state.i = 0;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs [data-mode]"), function (o) {
      o.setAttribute("aria-selected", String(o === b));
    });
    render();
  });
});

document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight") { stop(); go(state.i + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { stop(); go(state.i - 1); e.preventDefault(); }
  else if (e.key === " ") { play(); e.preventDefault(); }
});

// ---------------------------------------------------------------------------
// Self-test. Silent when it passes; loud when it does not.
// ---------------------------------------------------------------------------
(function selftest() {
  var fails = [];
  function ok(c, m) { if (!c) fails.push(m); }

  Object.keys(MODES).forEach(function (m) {
    var fs = MODES[m].frames;
    ok(fs.length > 0, m + ": has frames");
    fs.forEach(function (fr, i) {
      var w = m + " step " + (i + 1);
      ok(!!fr.title, w + ": has a title");
      ok(Array.isArray(fr.body) && fr.body.length, w + ": body is a bullet list");
      ok(Array.isArray(fr.term) && fr.term.length, w + ": has terminal output");
      ok(!!fr.todo, w + ": names the ritual step it belongs to");
      ok(Array.isArray(fr.local) && Array.isArray(fr.remote), w + ": draws both copies");
      if (fr.diff) ok(fr.lineNote, w + ": a diff must carry a THIS STEP note");
      if (fr.lineNote) ok(fr.diff && fr.diffHl < fr.diff.length, w + ": note points at a real diff row");
      if (fr.prNote) ok(!!fr.pr, w + ": a PR note needs a PR card to sit in");
      if (fr.review) ok(!!fr.pr, w + ": a review comment needs a PR card");
    });
    ok(!!fs[fs.length - 1].action, m + ": last step hands off");
  });

  // The two claims these tabs rest on.
  var afterCommit = MODES.line.frames[2];
  ok(afterCommit.local[0].commits.length > afterCommit.remote[0].commits.length,
     "tab 1: commit must leave the local copy AHEAD of GitHub");
  var onBranch = MODES.branch.frames[2];
  ok(onBranch.local[0].commits.length === 4,
     "tab 2: committing on a branch must leave main untouched");

  // The Week 10 preview earns its place only if the header count actually moves.
  var preview = MODES.pr.frames.filter(function (fr) { return !!fr.review; });
  ok(preview.length === 2, "tab 3: two Week 10 preview frames");
  ok(preview[1].pr.adds > preview[0].pr.adds,
     "tab 3: pushing the fix must move the PR header count");
  ok(preview[1].local[1].commits.length > preview[0].local[1].commits.length,
     "tab 3: the fix must be a real commit on the branch");

  // Recovery advice is copied verbatim by someone already panicking.
  var oopsCmds = JSON.stringify(MODES.oops.frames.map(function (fr) { return fr.term; }));
  ok(oopsCmds.indexOf("reset --hard") < 0, "tab 4: must not prescribe reset --hard");

  var node = document.getElementById("selftest");
  if (!fails.length) { node.style.display = "none"; return; }
  node.style.display = "";
  node.style.color = "#c0392b";
  node.style.fontWeight = "700";
  node.textContent = "Stepper self-test: " + fails.length + " problem(s) -- " + fails.join("; ");
})();

render();
</script>
</body>
</html>
